<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121312" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
:root{
  --bg:#f4f2ec; --card:#ffffff; --ink:#1b1c1a; --muted:#6f716b; --line:#e3e0d7;
  --accent:#1e6b4e; --accent-soft:#dcebe3; --warn:#b7791f; --bad:#c0432c; --bad-soft:#f6e1dc;
  --good:#1e6b4e; --track:#ebe8df; --sheet:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121312; --card:#1c1d1b; --ink:#ecebe6; --muted:#9a9c95; --line:#2b2c29;
    --accent:#5fbf92; --accent-soft:#1f3a2e; --warn:#e0a84a; --bad:#ef7a62; --bad-soft:#3a221d;
    --good:#5fbf92; --track:#2a2b28; --sheet:#1c1d1b; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; min-height:100vh}
.num{font-family:ui-rounded,-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 72px}
:root{color-scheme:light dark}

header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.month{display:flex;align-items:center;gap:4px}
.month h1{font-size:20px;font-weight:650;margin:0;min-width:128px;text-align:center;letter-spacing:-.01em}
.icon-btn{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:active{background:var(--track)}
.sync-btn{display:flex;align-items:center;gap:6px;background:var(--accent);color:#fff;padding:8px 14px;border-radius:20px;font-weight:600;font-size:15px}
@media (prefers-color-scheme: dark){.sync-btn{color:#0f1a14}}
.sync-btn:active{opacity:.8}

.hero{padding:18px 0 8px}
.hero .label{color:var(--muted);font-size:14px}
.hero .big{font-size:46px;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:2px 0 4px}
.hero .big.over{color:var(--bad)}
.hero .sub{color:var(--muted);font-size:15px}
.hero .sub b{color:var(--ink);font-weight:600}

.bar{position:relative;height:10px;background:var(--track);border-radius:5px;overflow:hidden;margin:14px 0 6px}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.bar>i.over{background:var(--bad)}
.bar>i.warn{background:var(--warn)}
.pace{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.bar-legend{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 6px}
.stat{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:17px;font-weight:650}

.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);color:var(--ink);
  border-radius:14px;padding:12px 14px;margin:12px 0;font-size:15px;width:100%;text-align:left}
.banner b{font-weight:650}

h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:22px 4px 8px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.card>.row:first-child,.card>*:first-child .row{border-top:0}
.row:active{background:var(--track)}
.row .main{flex:1;min-width:0}
.row .title{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:600;white-space:nowrap}
.amt.in{color:var(--good)}
.amt.muted{color:var(--muted);font-weight:500}
.cat-row .mini{height:5px;background:var(--track);border-radius:3px;margin-top:7px;overflow:hidden}
.cat-row .mini>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.cat-row .mini>i.over{background:var(--bad)}
.cat-row .mini>i.warn{background:var(--warn)}
.cat-row{align-items:flex-start}
.cat-row .dot{margin-top:6px}
.cat-row .top{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.cat-row .top .num{font-weight:600;white-space:nowrap}
.cat-row .top .over{color:var(--bad)}
.cat-row .sub{font-size:12px;color:var(--muted);margin-top:5px}
.dot{width:10px;height:10px;border-radius:5px;flex:none}
.chip{display:inline-block;font-size:12px;padding:1px 7px;border-radius:9px;background:var(--track);color:var(--muted);margin-left:4px;vertical-align:1px}
.chip.need{background:var(--bad-soft);color:var(--bad)}
.day{font-size:13px;color:var(--muted);margin:16px 4px 6px;display:flex;justify-content:space-between}

.search{display:flex;gap:8px;margin:12px 0 4px}
.search input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.filter-pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border-radius:14px;padding:5px 10px;font-size:14px;margin-top:8px}

.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:5}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 18px;font-weight:500}
nav button.on{color:var(--accent)}
nav svg{width:24px;height:24px}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:26px;
  background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:4}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--sheet);border-radius:20px 20px 0 0;
  transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:11;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet-head h3{margin:0;font-size:18px}
.link{color:var(--accent);font-weight:600}
.danger{color:var(--bad);font-weight:600}
.field{margin:12px 0}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 2px 5px}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.field textarea{min-height:110px;resize:vertical}
.amount-input{font-size:32px!important;font-weight:700;font-family:ui-rounded,-apple-system,system-ui;text-align:center;padding:10px!important}
.seg{display:flex;background:var(--bg);border-radius:11px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;padding:7px;border-radius:9px;font-size:15px;color:var(--muted);font-weight:550}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.cats{display:flex;flex-wrap:wrap;gap:7px}
.cats button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:18px;padding:7px 12px;font-size:15px}
.cats button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.check{display:flex;gap:10px;align-items:center;font-size:15px;margin:14px 2px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.primary{width:100%;background:var(--accent);color:#fff;border-radius:14px;padding:14px;font-weight:650;font-size:17px;margin-top:8px}
@media (prefers-color-scheme: dark){.primary{color:#0f1a14}}
.secondary{width:100%;background:var(--track);border-radius:14px;padding:13px;font-weight:600;margin-top:8px}
.row-actions{display:flex;justify-content:space-between;margin-top:16px}

.budget-row{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line)}
.budget-row:first-child{border-top:0}
.budget-row .name{flex:1;font-weight:550;display:flex;align-items:center;gap:10px;min-width:0}
.budget-row .name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.budget-row input{width:96px;text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.budget-row .x{color:var(--muted);font-size:13px}
.total-row{display:flex;justify-content:space-between;padding:12px 14px;border-top:1px solid var(--line);font-weight:650}
.help{font-size:14px;color:var(--muted);margin:8px 4px;line-height:1.5}
.help code{background:var(--track);padding:1px 5px;border-radius:5px;font-size:13px;color:var(--ink)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:20px;font-size:15px;font-weight:550;transition:transform .25s;z-index:20;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<button class="fab" id="fab" aria-label="Add transaction">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav id="nav">
  <button data-tab="overview" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V12l6 6"/></svg>Overview</button>
  <button data-tab="activity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Activity</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Budgets</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" class="hidden">

<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
